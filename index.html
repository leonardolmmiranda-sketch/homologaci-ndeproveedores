<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --yellow: #FFE600; --yellow-dark: #E6CF00;
  --blue: #3483FA; --blue-dark: #2968C8; --blue-deeper: #1A4F9E;
  --blue-light: #EBF3FF;
  --lav-bg: #F4F2FF; --lav-border: #DDD9F9; --lav-mid: #AFA9EC;
  --lav-main: #7F77DD; --lav-dark: #534AB7; --lav-deeper: #26215C;
  --text: #333333; --gray: #717171; --gray-light: #F5F5F5;
  --border: #EBEBEB; --white: #FFFFFF;
  --green: #00A650; --green-dark: #007A3D; --green-light: #E8F8EF;
  --orange: #FF7733; --orange-light: #FFF0E8;
  --red: #F23D4F; --red-light: #FEE8EA;
}
body { font-family: 'Inter', sans-serif; background: #F0F0F0; color: var(--text); min-height: 100vh; }
header { background: var(--yellow); height: 60px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--yellow-dark); }
.logo { display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; }
.logo-mark { width: 36px; height: 36px; background: var(--lav-dark); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 20px; height: 20px; }
.logo-name { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 17px; color: var(--lav-deeper); }
.logo-sub { font-size: 10px; font-weight: 600; color: var(--lav-dark); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.lang-link { font-size: 12px; font-weight: 600; color: var(--lav-deeper); text-decoration: none; background: rgba(255,255,255,0.7); padding: 5px 14px; border-radius: 20px; border: 1px solid var(--yellow-dark); cursor: pointer; transition: background .15s; }
.lang-link:hover { background: white; }
.header-back-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--lav-deeper); background: rgba(255,255,255,0.75); border: 1.5px solid var(--yellow-dark); border-radius: 20px; padding: 5px 14px; cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s; }
.header-back-btn:hover { background: white; }
.header-back-btn svg { width: 14px; height: 14px; }
.hero { background: var(--yellow); padding: 3.5rem 2rem 3rem; text-align: center; border-bottom: 3px solid var(--yellow-dark); position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255,255,255,0.08) 40px, rgba(255,255,255,0.08) 80px); pointer-events: none; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--lav-dark); margin-bottom: 16px; background: rgba(127,119,221,0.12); padding: 5px 16px; border-radius: 20px; }
.hero-title-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.hero-ml-icon { width: 52px; height: 52px; background: var(--lav-dark); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hero-ml-icon svg { width: 30px; height: 30px; }
.hero h1 { font-family: 'Raleway', sans-serif; font-size: clamp(28px,5vw,48px); font-weight: 900; color: var(--lav-deeper); letter-spacing: -1px; line-height: 1.1; }
.hero h1 span { background: var(--lav-dark); color: var(--yellow); padding: 2px 10px; border-radius: 6px; display: inline-block; }
.hero-sub { font-size: 15px; color: var(--lav-dark); opacity: 0.85; max-width: 520px; margin: 0 auto 24px; line-height: 1.6; }
.hero-pills { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pill { background: white; border: 1px solid rgba(127,119,221,0.2); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 500; color: var(--lav-dark); display: flex; align-items: center; gap: 5px; }
.container { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
.section-title { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.country-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.country-tab { display: flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 18px; font-family: 'Raleway', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: all .18s; animation: fadeUp .35s ease both; }
.country-tab:hover { border-color: var(--lav-main); color: var(--lav-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(127,119,221,0.12); }
.flag { font-size: 22px; line-height: 1; }
.back-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--lav-deeper); background: var(--white); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 16px; cursor: pointer; margin-bottom: 1.5rem; transition: all .15s; font-family: 'Inter', sans-serif; }
.back-btn:hover { border-color: var(--lav-main); color: var(--lav-dark); background: var(--lav-bg); }
.back-btn svg { width: 16px; height: 16px; }
.eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 16px; }
.eq-card { background: var(--white); border-radius: 16px; border: 1px solid var(--lav-border); overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; animation: fadeUp .35s ease both; }
.eq-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(127,119,221,0.15); border-color: var(--lav-main); }
.eq-card-top { background: var(--lav-bg); padding: 1.5rem 1.25rem 1.25rem; position: relative; overflow: hidden; border-bottom: 1px solid var(--lav-border); }
.eq-card-top::after { content: ''; position: absolute; bottom: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(127,119,221,0.08); }
.eq-icon-wrap { width: 56px; height: 56px; margin-bottom: 12px; position: relative; z-index: 1; }
.eq-icon-wrap svg { width: 56px; height: 56px; }
.eq-card-name { font-family: 'Raleway', sans-serif; font-size: 15px; font-weight: 800; color: var(--lav-deeper); line-height: 1.25; position: relative; z-index: 1; }
.eq-card-specs { font-size: 11px; color: var(--lav-dark); margin-top: 4px; position: relative; z-index: 1; opacity: 0.7; }
.eq-card-bottom { padding: 1rem 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 10px; background: var(--white); }
.eq-sup-count { font-size: 12px; color: var(--gray); }
.eq-sup-count strong { color: var(--green); font-weight: 700; }
.eq-cta { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); margin-top: auto; }
.eq-cta-text { font-size: 13px; font-weight: 600; color: var(--lav-dark); }
.eq-cta-arrow { width: 28px; height: 28px; background: var(--lav-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; transition: transform .15s; }
.eq-card:hover .eq-cta-arrow { transform: translateX(3px); background: var(--lav-dark); }
.detail-hero { background: var(--lav-bg); border: 1px solid var(--lav-border); border-radius: 16px; padding: 2rem; display: flex; align-items: center; gap: 20px; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
.detail-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(127,119,221,0.07); }
.detail-icon-wrap { width: 80px; height: 80px; flex-shrink: 0; background: var(--lav-border); border-radius: 14px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.detail-icon-wrap svg { width: 60px; height: 60px; }
.detail-info { position: relative; z-index: 1; }
.detail-eq-name { font-family: 'Raleway', sans-serif; font-size: 26px; font-weight: 900; color: var(--lav-deeper); line-height: 1.15; margin-bottom: 4px; }
.detail-eq-specs { font-size: 13px; color: var(--lav-dark); opacity: 0.75; }
.detail-country-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(127,119,221,0.12); border: 1px solid var(--lav-border); color: var(--lav-dark); border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 600; margin-top: 8px; }
.sup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 16px; }
.sup-card { background: var(--white); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; animation: fadeUp .3s ease both; }
.sup-card-top { background: var(--lav-bg); border-bottom: 1px solid var(--lav-border); padding: 1.25rem 1.5rem; display: flex; align-items: flex-start; gap: 12px; }
.sup-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--lav-main); display: flex; align-items: center; justify-content: center; font-family: 'Raleway', sans-serif; font-size: 16px; font-weight: 800; color: white; flex-shrink: 0; }
.sup-name { font-family: 'Raleway', sans-serif; font-size: 16px; font-weight: 800; color: var(--lav-deeper); line-height: 1.2; }
.sup-company { font-size: 12px; color: var(--gray); margin-top: 2px; }
.sup-card-body { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 10px; }
.she-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.she-ok { background: var(--green-light); color: var(--green-dark); }
.she-no { background: var(--red-light); color: var(--red); }
.she-ana { background: var(--orange-light); color: var(--orange); }
.she-nd { background: var(--gray-light); color: var(--gray); }
.she-dot { width: 6px; height: 6px; border-radius: 50%; }
.she-ok .she-dot { background: var(--green); }
.she-no .she-dot { background: var(--red); }
.she-ana .she-dot { background: var(--orange); }
.she-nd .she-dot { background: #ccc; }
.contact-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
.contact-row svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--gray); }
.contact-row a { color: var(--lav-dark); text-decoration: none; font-weight: 500; }
.contact-row a:hover { text-decoration: underline; }
.no-sup { background: var(--white); border-radius: 16px; border: 1px solid var(--border); padding: 3rem 2rem; text-align: center; color: var(--gray); font-size: 14px; }
.no-sup-icon { font-size: 36px; display: block; margin-bottom: 12px; }
footer { background: var(--yellow); border-top: 2px solid var(--yellow-dark); padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.footer-brand { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 700; color: var(--lav-deeper); }
.footer-note { font-size: 12px; color: var(--lav-dark); opacity: 0.7; }
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>

  'Baker de Volumoso':`<svg viewBox="0 0 56 56" fill="none"><rect x="6" y="10" width="44" height="26" rx="4" fill="${IS}" stroke="${IC}" stroke-width="1.5"/><line x1="6" y1="36" x2="50" y2="36" stroke="${IC}" stroke-width="1.5"/><circle cx="16" cy="45" r="5" fill="${IC}"/><circle cx="40" cy="45" r="5" fill="${IC}"/><circle cx="16" cy="45" r="2.5" fill="white"/><circle cx="40" cy="45" r="2.5" fill="white"/></svg>`,
  'Baker de GM':`<svg viewBox="0 0 56 56" fill="none"><rect x="6" y="10" width="44" height="26" rx="4" fill="${IS}" stroke="${IC}" stroke-width="1.5"/><line x1="6" y1="23" x2="50" y2="23" stroke="${IM}" stroke-width="1"/><line x1="28" y1="10" x2="28" y2="36" stroke="${IM}" stroke-width="1"/><text x="39" y="20" text-anchor="middle" font-size="9" fill="#26215C" font-family="Raleway,sans-serif" font-weight="800">GM</text><circle cx="16" cy="45" r="5" fill="${IC}"/><circle cx="40" cy="45" r="5" fill="${IC}"/><circle cx="16" cy="45" r="2.5" fill="white"/><circle cx="40" cy="45" r="2.5" fill="white"/></svg>`,
  'Baker de Frágil':`<svg viewBox="0 0 56 56" fill="none"><rect x="6" y="10" width="44" height="26" rx="4" fill="${IS}" stroke="${IC}" stroke-width="1.5"/><path d="M22 18l6 8 6-8" stroke="${IC}" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="28" cy="30" r="3" fill="${IC}"/><circle cx="16" cy="45" r="5" fill="${IC}"/><circle cx="40" cy="45" r="5" fill="${IC}"/><circle cx="16" cy="45" r="2.5" fill="white"/><circle cx="40" cy="45" r="2.5" fill="white"/></svg>`,
  'Carrito de Elevación Bulky':`<svg viewBox="0 0 56 56" fill="none"><rect x="8" y="26" width="40" height="14" rx="4" fill="${IS}" stroke="${IC}" stroke-width="1.5"/><rect x="16" y="10" width="24" height="16" rx="3" fill="${IC}"/><path d="M24 10l4-7 4 7" fill="${IM}"/><circle cx="18" cy="48" r="5" fill="${IC}"/><circle cx="38" cy="48" r="5" fill="${IC}"/><circle cx="18" cy="48" r="2.5" fill="white"/><circle cx="38" cy="48" r="2.5" fill="white"/></svg>`,
};

const SHEET_DATA = {
  'Brasil':[], 'Argentina':[],
  'México':[
    {'Equipamiento':'Baker de Volumoso','Nombre del Proveedor':'BIS','Contacto':'Claudio Fernandez','Status de Homologación':'Homologado','Aprobado por SHE':'Sim','Correo':'claudio.fernandez@bis-mm.com','Teléfono':'21990417293','Capacidad (unit/mes)':'300'},
    {'Equipamiento':'Baker de Volumoso','Nombre del Proveedor':'Perle Manufacturas','Contacto':'Eunice Picazo','Status de Homologación':'Homologado','Aprobado por SHE':'Sim','Correo':'perleventas@gmail.com','Teléfono':'21990417293','Capacidad (unit/mes)':'200'},
  ],
  'Chile':[], 'Colômbia':[], 'Uruguai':[],
};

let lang='pt', view='countries', activeCountry=null, activeEq=null;

function normaliseEq(raw){const w=(raw||'').toLowerCase().trim().replace(/\s+/g,' ');const n=w.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return EQ_ALIASES[w]||EQ_ALIASES[n]||null;}
function getSuppliers(country,eqKey){return(SHEET_DATA[country]||[]).filter(r=>normaliseEq(r['Equipamiento'])===eqKey);}
function toggleLang(){lang=lang==='pt'?'es':'pt';updateStatic();render();updateHeaderBack();}
function updateStatic(){const t=T[lang];document.documentElement.lang=lang==='pt'?'pt-BR':'es-419';document.getElementById('logo-sub').textContent=t.logoSub;document.getElementById('lang-link').textContent=t.langLink;document.getElementById('hero-eyebrow').textContent=t.eyebrow;document.getElementById('hero-h1').innerHTML=`${t.h1a} <span>${t.h1b}</span>`;document.getElementById('hero-sub').textContent=t.sub;document.getElementById('hero-pills').innerHTML=t.pills.map(p=>`<div class="pill">${p}</div>`).join('');document.getElementById('footer-note').textContent=t.footerNote;document.getElementById('back-home-label').textContent=t.backHome;}

function render(){
  const t=T[lang];const app=document.getElementById('app');
  if(view==='countries'){
    app.innerHTML=`<div class="section-title">${t.choosePais}</div><div class="country-tabs">${COUNTRIES.map((c,i)=>`<div class="country-tab" onclick="selectCountry('${c.key}')" style="animation-delay:${i*0.06}s"><span class="flag">${c.flag}</span>${c.key}</div>`).join('')}</div>`;
  }else if(view==='equipments'){
    const country=COUNTRIES.find(c=>c.key===activeCountry);
    app.innerHTML=`<button class="back-btn" onclick="goBack()"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>${t.back}</button><div class="section-title">${country.flag} ${activeCountry} · ${t.chooseEq}</div><div class="eq-grid">${EQS.map((eq,i)=>{const n=getSuppliers(activeCountry,eq.key).length;const name=eq[lang]||eq.pt;const specs=lang==='pt'?eq.specs_pt:eq.specs_es;return`<div class="eq-card" onclick="selectEq('${eq.key}')" style="animation-delay:${i*0.04}s"><div class="eq-card-top"><div class="eq-icon-wrap">${ICONS[eq.key]||''}</div><div class="eq-card-name">${name}</div><div class="eq-card-specs">${specs}</div></div><div class="eq-card-bottom"><div class="eq-sup-count"><strong>${n}</strong> ${t.homologado}</div><div class="eq-cta"><span class="eq-cta-text">${t.seeSuppliers}</span><div class="eq-cta-arrow">→</div></div></div></div>`;}).join('')}</div>`;
  }else{
    const country=COUNTRIES.find(c=>c.key===activeCountry);const eq=EQS.find(e=>e.key===activeEq);
    const eqName=eq[lang]||eq.pt;const specs=lang==='pt'?eq.specs_pt:eq.specs_es;
    const sups=getSuppliers(activeCountry,activeEq);
    const supContent=sups.length?`<div class="sup-grid">${sups.map((s,i)=>{const name=s['Nombre del Proveedor']||'—';const contact=s['Contacto']||'';const email=s['Correo']||'';const phone=s['Teléfono']||'';const capacity=s['Capacidad (unit/mes)']||'';const status=s['Status de Homologación']||'';const initials=name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';const sv=(s['Aprobado por SHE']||'').toLowerCase().trim();let sheLbl,sheCls;if(['sim','si','sí','yes','s'].includes(sv)){sheLbl=t.sheYes;sheCls='she-ok';}else if(['não','nao','no','n'].includes(sv)){sheLbl=t.sheNo;sheCls='she-no';}else if(sv.includes('anal')){sheLbl=t.sheAna;sheCls='she-ana';}else{sheLbl=t.sheNd;sheCls='she-nd';}return`<div class="sup-card" style="animation-delay:${i*0.07}s"><div class="sup-card-top"><div class="sup-avatar">${initials}</div><div><div class="sup-name">${name}</div>${status?`<div class="sup-company">${status}</div>`:''}<div style="margin-top:8px"><span class="she-badge ${sheCls}"><span class="she-dot"></span>${sheLbl}</span></div></div></div><div class="sup-card-body">${contact?`<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M2 12c0-2.761 2.239-5 5-5s5 2.239 5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span><strong>${t.contactPerson}:</strong> ${contact}</span></div>``:''}${email?`<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><rect x="1.5" y="3" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 5l5.5 3.5L12.5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><a href="mailto:${email}">${email}</a></div>`:''}${phone?`<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><path d="M4 2h2.5l1 3-1.5 1c.7 1.4 1.6 2.3 3 3l1-1.5 3 1V11c0 .6-.5 1-1.1.9C4.7 11.1 2 7.3 2 3.1 2 2.5 2.5 2 3 2H4z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${phone}</span></div>`:''}${capacity?`<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><rect x="1.5" y="5" width="11" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 5V3.5a2.5 2.5 0 015 0V5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span>${capacity} un/mês</span></div>`:''}</div></div>`;}).join('')}</div>`:`<div class="no-sup"><span class="no-sup-icon">📭</span><strong>${t.noSup}</strong><br><span style="font-size:12px;color:var(--gray);margin-top:6px;display:block">${t.noSupHint}</span></div>`;
    app.innerHTML=`<button class="back-btn" onclick="goBack()"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>${t.back}</button><div class="detail-hero"><div class="detail-icon-wrap">${ICONS[activeEq]||''}</div><div class="detail-info"><div class="detail-eq-name">${eqName}</div><div class="detail-eq-specs">${specs}</div><div class="detail-country-badge">${country.flag} ${activeCountry}</div></div></div><div class="section-title">${t.suppliers}</div>${supContent}`;
  }
}

function updateHeaderBack(){const btn=document.getElementById('header-back-btn');if(view==='countries')btn.style.display='none';else{btn.style.display='inline-flex';document.getElementById('header-back-label').textContent=T[lang].back;}}
function selectCountry(k){activeCountry=k;view='equipments';render();updateHeaderBack();window.scrollTo({top:0,behavior:'smooth'});}
function selectEq(k){activeEq=k;view='detail';render();updateHeaderBack();window.scrollTo({top:0,behavior:'smooth'});}
function goBack(){if(view==='detail'){view='equipments';activeEq=null;}else{view='countries';activeCountry=null;}render();updateHeaderBack();window.scrollTo({top:0,behavior:'smooth'});}
function goHome(){view='countries';activeCountry=null;activeEq=null;render();updateHeaderBack();window.scrollTo({top:0,behavior:'smooth'});}

updateStatic();render();updateHeaderBack();
</script>
</body>
</html>
