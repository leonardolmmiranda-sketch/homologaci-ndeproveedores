<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --yellow: #FFE600; --yellow-dark: #E6CF00; --yellow-light: #FFFBE6;
  --blue: #3483FA; --blue-dark: #2968C8; --blue-deeper: #1A4F9E;
  --blue-light: #EBF3FF; --dark: #1A1A2E; --text: #333333;
  --gray: #717171; --gray-light: #F5F5F5; --border: #EBEBEB; --white: #FFFFFF;
  --green: #00A650; --green-dark: #007A3D; --green-light: #E8F8EF;
  --orange: #FF7733; --orange-light: #FFF0E8;
  --red: #F23D4F; --red-light: #FEE8EA;
}
body { font-family: 'Inter', sans-serif; background: #F0F0F0; color: var(--text); min-height: 100vh; }

/* ── HEADER ── */
header { background: var(--yellow); height: 60px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--yellow-dark); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer; }
.logo-mark { width: 36px; height: 36px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 20px; height: 20px; }
.logo-name { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 17px; color: var(--blue-deeper); }
.logo-sub { font-size: 10px; font-weight: 600; color: var(--blue-dark); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }

.lang-link { font-size: 12px; font-weight: 600; color: var(--blue-deeper); text-decoration: none; background: rgba(255,255,255,0.7); padding: 5px 14px; border-radius: 20px; border: 1px solid var(--yellow-dark); transition: background .15s; cursor: pointer; }
.lang-link:hover { background: white; }
.header-back-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--blue-deeper); background: rgba(255,255,255,0.75); border: 1.5px solid var(--yellow-dark); border-radius: 20px; padding: 5px 14px; cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s; }
.header-back-btn:hover { background: white; }
.header-back-btn svg { width: 14px; height: 14px; }

/* ── HERO ── */
.hero { background: var(--yellow); padding: 3.5rem 2rem 3rem; text-align: center; border-bottom: 3px solid var(--yellow-dark); position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255,255,255,0.08) 40px, rgba(255,255,255,0.08) 80px); pointer-events: none; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin-bottom: 16px; background: rgba(52,131,250,0.1); padding: 5px 16px; border-radius: 20px; }
.hero-title-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.hero-ml-icon { width: 52px; height: 52px; background: var(--blue); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hero-ml-icon svg { width: 30px; height: 30px; }
.hero h1 { font-family: 'Raleway', sans-serif; font-size: clamp(28px, 5vw, 48px); font-weight: 900; color: var(--blue-deeper); letter-spacing: -1px; line-height: 1.1; }
.hero h1 span { background: var(--blue); color: var(--yellow); padding: 2px 10px; border-radius: 6px; display: inline-block; }
.hero-sub { font-size: 15px; color: var(--blue-dark); opacity: 0.85; max-width: 520px; margin: 0 auto 24px; line-height: 1.6; }
.hero-pills { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pill { background: white; border: 1px solid rgba(41,104,200,0.2); border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 500; color: var(--blue-dark); display: flex; align-items: center; gap: 5px; }

/* ── CONTAINER ── */
.container { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
.section-title { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── COUNTRY TABS ── */
.country-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.country-tab { display: flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 18px; font-family: 'Raleway', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: all .18s; animation: fadeUp .35s ease both; }
.country-tab:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(52,131,250,0.1); }
.flag { font-size: 22px; line-height: 1; }

/* ── BACK BUTTON ── */
.back-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--blue-deeper); background: var(--white); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 16px; cursor: pointer; margin-bottom: 1.5rem; transition: all .15s; font-family: 'Inter', sans-serif; }
.back-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.back-btn svg { width: 16px; height: 16px; }

/* ── EQUIPMENT GRID ── */
.eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.eq-card { background: var(--white); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; animation: fadeUp .35s ease both; }
.eq-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(52,131,250,0.12); border-color: var(--blue); }
.eq-card-top { background: var(--blue); padding: 1.5rem 1.25rem 1.25rem; position: relative; overflow: hidden; }
.eq-card-top::after { content: ''; position: absolute; bottom: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.07); }
.eq-card-top::before { content: ''; position: absolute; top: -30px; left: 50%; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.05); }
.eq-icon-wrap { width: 56px; height: 56px; margin-bottom: 12px; position: relative; z-index: 1; }
.eq-icon-wrap svg { width: 56px; height: 56px; }
.eq-card-name { font-family: 'Raleway', sans-serif; font-size: 15px; font-weight: 800; color: var(--yellow); line-height: 1.25; position: relative; z-index: 1; }
.eq-card-specs { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; position: relative; z-index: 1; }
.eq-card-bottom { padding: 1rem 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.eq-sup-count { font-size: 12px; color: var(--gray); }
.eq-sup-count strong { color: var(--green); font-weight: 700; }
.eq-cta { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); margin-top: auto; }
.eq-cta-text { font-size: 13px; font-weight: 600; color: var(--blue); }
.eq-cta-arrow { width: 28px; height: 28px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; transition: transform .15s; }
.eq-card:hover .eq-cta-arrow { transform: translateX(3px); }

/* ── DETAIL HERO ── */
.detail-hero { background: var(--blue); border-radius: 16px; padding: 2rem; display: flex; align-items: center; gap: 20px; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
.detail-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.06); }
.detail-hero::after { content: ''; position: absolute; bottom: -30px; left: 30%; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.04); }
.detail-icon-wrap { width: 80px; height: 80px; flex-shrink: 0; background: rgba(255,255,255,0.12); border-radius: 14px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.detail-icon-wrap svg { width: 60px; height: 60px; }
.detail-info { position: relative; z-index: 1; }
.detail-eq-name { font-family: 'Raleway', sans-serif; font-size: 26px; font-weight: 900; color: var(--yellow); line-height: 1.15; margin-bottom: 4px; }
.detail-eq-specs { font-size: 13px; color: rgba(255,255,255,0.65); }
.detail-country-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,230,0,0.15); border: 1px solid rgba(255,230,0,0.3); color: var(--yellow); border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 600; margin-top: 8px; }

/* ── SUPPLIER CARDS ── */
.sup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.sup-card { background: var(--white); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; animation: fadeUp .3s ease both; }
.sup-card-top { background: var(--blue-light); border-bottom: 1px solid rgba(52,131,250,0.12); padding: 1.25rem 1.5rem; display: flex; align-items: flex-start; gap: 12px; }
.sup-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; font-family: 'Raleway', sans-serif; font-size: 16px; font-weight: 800; color: var(--yellow); flex-shrink: 0; }
.sup-name { font-family: 'Raleway', sans-serif; font-size: 16px; font-weight: 800; color: var(--blue-deeper); line-height: 1.2; }
.sup-company { font-size: 12px; color: var(--gray); margin-top: 2px; }
.sup-card-body { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 10px; }
.she-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.she-ok { background: var(--green-light); color: var(--green-dark); }
.she-no { background: var(--red-light); color: var(--red); }
.she-ana { background: var(--orange-light); color: var(--orange); }
.she-nd { background: var(--gray-light); color: var(--gray); }
.she-dot { width: 6px; height: 6px; border-radius: 50%; }
.she-ok .she-dot { background: var(--green); }
.she-no .she-dot { background: var(--red); }
.she-ana .she-dot { background: var(--orange); }
.she-nd .she-dot { background: #ccc; }
.contact-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
.contact-row svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--gray); }
.contact-row a { color: var(--blue); text-decoration: none; font-weight: 500; }
.contact-row a:hover { text-decoration: underline; }
.no-sup { background: var(--white); border-radius: 16px; border: 1px solid var(--border); padding: 3rem 2rem; text-align: center; color: var(--gray); font-size: 14px; }
.no-sup-icon { font-size: 36px; display: block; margin-bottom: 12px; }

/* ── FOOTER ── */
footer { background: var(--yellow); border-top: 2px solid var(--yellow-dark); padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.footer-brand { font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 700; color: var(--blue-deeper); }
.footer-note { font-size: 12px; color: var(--blue-dark); opacity: 0.7; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

function parseCSVRow(row) {
  const res = []; let cur = ''; let inQ = false;
  for (let i = 0; i < row.length; i++) {
    if (row[i] === '"') { inQ = !inQ; }
    else if (row[i] === ',' && !inQ) { res.push(cur); cur = ''; }
    else cur += row[i];
  }
  res.push(cur); return res;
}
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVRow(lines[0]).map(h => h.replace(/"/g,'').trim());
  return lines.slice(1).map(line => {
    const vals = parseCSVRow(line);
    const obj = {};
    headers.forEach((h,i) => obj[h] = (vals[i]||'').replace(/"/g,'').trim());
    return obj;
  }).filter(r => Object.values(r).some(v => v));
}
async function fetchAll() {
  await Promise.all(COUNTRIES.map(async c => {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(c.sheet)}`;
      const r = await fetch(url);
      if (r.ok) sheetData[c.key] = parseCSV(await r.text());
    } catch {}
  }));
}

function getSuppliers(countryKey, eqKey) {
  if (demoMode) {
    return (DEMO[countryKey]?.[eqKey] || []).map(d => ({

      'Contacto': d.contact, 'Correo': d.email,
      'Teléfono': d.phone, 'Aprobado por SHE': d.she,
    }));
  }
  return (sheetData[countryKey]||[]).filter(r =>
    (r['Equipamiento']||'').trim().toLowerCase() === eqKey.toLowerCase() &&
    (r['Nombre del Proveedor'])
  );
}

function selectCountry(key) { activeCountry=key; view='equipments'; render(); updateHeaderBack(); window.scrollTo({top:0,behavior:'smooth'}); }

}
function goHome() { view='countries'; activeCountry=null; activeEq=null; render(); updateHeaderBack(); window.scrollTo({top:0,behavior:'smooth'}); }

async function init() {
