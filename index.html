<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --yellow:#FFF8DC;
  --yellow-mid:#F5E97A;
  --yellow-dark:#E8D98A;
  --yellow-light:#FFFDF0;
  --blue:#2C3E6B;
  --blue-dark:#1E2D52;
  --blue-deeper:#15203D;
  --blue-light:#EEF2FF;
  --lav-bg:#F0EEFB;--lav-border:#D5D0F5;--lav-mid:#AFA9EC;
  --lav-main:#5B3AA8;--lav-dark:#3D2578;--lav-deeper:#26195C;
  --text:#333;--gray:#717171;--gray-light:#F5F5F5;--border:#EBEBEB;--white:#FFF;
  --green:#2E7D5E;--green-dark:#1F5C44;--green-light:#E8F5EE;
  --orange:#C4631A;--orange-light:#FDF0E6;
  --red:#F23D4F;--red-light:#FEE8EA;
}
body{font-family:'Inter',sans-serif;background:#EDEAE3;color:var(--text);min-height:100vh}
header{background:var(--yellow);height:60px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--yellow-dark)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.logo-mark{width:36px;height:36px;background:var(--lav-dark);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:20px;height:20px}
.logo-name{font-family:'Raleway',sans-serif;font-weight:800;font-size:17px;color:var(--lav-deeper)}
.logo-sub{font-size:10px;font-weight:600;color:var(--lav-dark);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.lang-link{font-size:12px;font-weight:600;color:var(--blue-deeper);text-decoration:none;background:rgba(255,255,255,0.7);padding:5px 14px;border-radius:20px;border:1px solid var(--yellow-dark);cursor:pointer;transition:background .15s}
.lang-link:hover{background:white}
.header-back-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--blue-deeper);background:rgba(255,255,255,0.75);border:1.5px solid var(--yellow-dark);border-radius:20px;padding:5px 14px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s}
.header-back-btn:hover{background:white}
.header-back-btn svg{width:14px;height:14px}
.hero{background:var(--yellow);padding:3.5rem 2rem 3rem;text-align:center;border-bottom:3px solid var(--yellow-dark);position:relative;overflow:hidden}
.hero::before{display:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lav-dark);margin-bottom:16px;background:rgba(91,58,168,0.1);padding:5px 16px;border-radius:20px}
.hero-title-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.hero-ml-icon{width:52px;height:52px;background:var(--lav-dark);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-ml-icon svg{width:30px;height:30px}
.hero h1{font-family:'Raleway',sans-serif;font-size:clamp(28px,5vw,48px);font-weight:900;color:var(--lav-deeper);letter-spacing:-1px;line-height:1.1}
.hero h1 span{background:var(--lav-dark);color:var(--yellow-mid);padding:2px 10px;border-radius:6px;display:inline-block}
.hero-sub{font-size:15px;color:var(--lav-dark);opacity:0.85;max-width:520px;margin:0 auto 24px;line-height:1.6}
.hero-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{background:white;border:1px solid rgba(91,58,168,0.18);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:500;color:var(--lav-dark)}
.container{max-width:1040px;margin:0 auto;padding:2.5rem 1.5rem 5rem}
.section-title{font-family:'Raleway',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:1.25rem;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.country-tabs{display:flex;gap:10px;flex-wrap:wrap}
.country-tab{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:10px 18px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;transition:all .18s;animation:fadeUp .35s ease both}
.country-tab:hover{border-color:var(--lav-main);color:var(--lav-dark);transform:translateY(-2px);box-shadow:0 6px 20px rgba(91,58,168,0.1)}
.flag{font-size:22px;line-height:1}
.back-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--lav-deeper);background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;margin-bottom:1.5rem;transition:all .15s;font-family:'Inter',sans-serif}
.back-btn:hover{border-color:var(--lav-main);color:var(--lav-dark);background:var(--lav-bg)}
.back-btn svg{width:16px;height:16px}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.eq-card{background:var(--white);border-radius:16px;border:1px solid var(--lav-border);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;animation:fadeUp .35s ease both}
.eq-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(91,58,168,0.13);border-color:var(--lav-main)}
.eq-card-top{background:var(--lav-bg);padding:1.5rem 1.25rem 1.25rem;position:relative;overflow:hidden;border-bottom:1px solid var(--lav-border)}
.eq-card-top::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(91,58,168,0.06)}
.eq-icon-wrap{width:56px;height:56px;margin-bottom:12px;position:relative;z-index:1}
.eq-icon-wrap svg{width:56px;height:56px}
.eq-card-name{font-family:'Raleway',sans-serif;font-size:15px;font-weight:800;color:var(--lav-deeper);line-height:1.25;position:relative;z-index:1}
.eq-card-specs{font-size:11px;color:var(--lav-dark);margin-top:4px;position:relative;z-index:1;opacity:0.7}
.eq-card-bottom{padding:1rem 1.25rem;flex:1;display:flex;flex-direction:column;gap:10px;background:var(--white)}
.eq-sup-count{font-size:12px;color:var(--gray)}
.eq-sup-count strong{color:var(--green);font-weight:700}
.eq-cta{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);margin-top:auto}
.eq-cta-text{font-size:13px;font-weight:600;color:var(--lav-dark)}
.eq-cta-arrow{width:28px;height:28px;background:var(--lav-main);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;transition:transform .15s}
.eq-card:hover .eq-cta-arrow{transform:translateX(3px);background:var(--lav-dark)}
.detail-hero{background:var(--lav-bg);border:1px solid var(--lav-border);border-radius:16px;padding:2rem;display:flex;align-items:center;gap:20px;margin-bottom:1.5rem;position:relative;overflow:hidden}
.detail-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(91,58,168,0.05)}
.detail-icon-wrap{width:80px;height:80px;flex-shrink:0;background:var(--lav-border);border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.detail-icon-wrap svg{width:60px;height:60px}
.detail-info{position:relative;z-index:1}
.detail-eq-name{font-family:'Raleway',sans-serif;font-size:26px;font-weight:900;color:var(--lav-deeper);line-height:1.15;margin-bottom:4px}
.detail-eq-specs{font-size:13px;color:var(--lav-dark);opacity:0.75}
.detail-country-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(91,58,168,0.1);border:1px solid var(--lav-border);color:var(--lav-dark);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;margin-top:8px}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sup-card{background:var(--white);border-radius:16px;border:1px solid var(--border);overflow:hidden;animation:fadeUp .3s ease both}
.sup-card-top{background:var(--lav-bg);border-bottom:1px solid var(--lav-border);padding:1.25rem 1.5rem;display:flex;align-items:flex-start;gap:12px}
.sup-avatar{width:44px;height:44px;border-radius:50%;background:var(--lav-main);display:flex;align-items:center;justify-content:center;font-family:'Raleway',sans-serif;font-size:16px;font-weight:800;color:white;flex-shrink:0}
.sup-name{font-family:'Raleway',sans-serif;font-size:16px;font-weight:800;color:var(--lav-deeper);line-height:1.2}
.sup-company{font-size:12px;color:var(--gray);margin-top:2px}
.sup-card-body{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:10px}
.she-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.she-ok{background:var(--green-light);color:var(--green-dark)}
.she-no{background:var(--red-light);color:var(--red)}
.she-ana{background:var(--orange-light);color:var(--orange)}
.she-nd{background:var(--gray-light);color:var(--gray)}
.she-dot{width:6px;height:6px;border-radius:50%}
.she-ok .she-dot{background:var(--green)}
.she-no .she-dot{background:var(--red)}
.she-ana .she-dot{background:var(--orange)}
.she-nd .she-dot{background:#ccc}
.contact-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.contact-row svg{width:14px;height:14px;flex-shrink:0;color:var(--gray)}
.contact-row a{color:var(--lav-dark);text-decoration:none;font-weight:500}
.contact-row a:hover{text-decoration:underline}
.no-sup{background:var(--white);border-radius:16px;border:1px solid var(--border);padding:3rem 2rem;text-align:center;color:var(--gray);font-size:14px}
.no-sup-icon{font-size:36px;display:block;margin-bottom:12px}
.disclaimer-bar{background:#FFF8E1;border:1px solid #FFE082;border-radius:12px;padding:14px 20px;margin-bottom:2rem;display:flex;align-items:flex-start;gap:12px;font-size:13px;color:#5D4037;line-height:1.6}
.disclaimer-bar svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:#F9A825}
.disclaimer-bar strong{color:#4E342E}
.disclaimer-bar a{color:var(--lav-main);font-weight:600;text-decoration:none}
.disclaimer-bar a:hover{text-decoration:underline}
.compras-card{background:var(--lav-bg);border:1px solid var(--lav-border);border-radius:12px;padding:14px 18px;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px;font-size:13px}
.compras-card svg{width:16px;height:16px;flex-shrink:0;color:var(--lav-dark)}
.compras-card-info{display:flex;flex-direction:column;gap:2px}
.compras-card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--lav-dark);opacity:0.7}
.compras-card-name{font-weight:700;color:var(--lav-deeper);font-size:13px}
.compras-card-email a{color:var(--lav-dark);font-size:12px;text-decoration:none;font-weight:500}
.compras-card-email a:hover{text-decoration:underline}
footer{background:var(--yellow);border-top:2px solid var(--yellow-dark);padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer-brand{font-family:'Raleway',sans-serif;font-size:13px;font-weight:700;color:var(--blue-deeper)}
.footer-note{font-size:12px;color:var(--blue-dark);opacity:0.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

var API_URL = "https://script.google.com/a/macros/mercadolivre.com/s/AKfycby4gtLve43trFmb0xVR1wRpDvgx_9MHwvHiaVwlmmFwo-R2hQyXgO_UGb98Vf2zeGCcPA/exec";
var REFRESH_MS = 5 * 60 * 1000;
function fetchData() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", API_URL, true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try { var data = JSON.parse(xhr.responseText); SHEET_DATA = data; render(); setStatus("ok"); }
      catch(e) { setStatus("err"); }
    } else { setStatus("err"); }
  };
  xhr.onerror = function() { setStatus("err"); };
  xhr.send();
}
function setStatus(s) {
  var el = document.getElementById("data-status");
  if (!el) return;
  if (s === "ok") { el.innerHTML = "&#10003; Dados atualizados da planilha"; el.style.color = "var(--green-dark)"; }
  else { el.innerHTML = "&#9888; Usando dados locais"; el.style.color = "var(--orange)"; }
}

// Detect language from: 1) URL param ?lang=, 2) referrer page, 3) browser language
(function() {
  var params = new URLSearchParams(window.location.search);
  var paramLang = (params.get("lang") || "").toLowerCase();
  var ref = document.referrer || "";
  if (paramLang === "es" || paramLang === "pt") {
    window.__initLang = paramLang;
  } else if (ref.indexOf("paginainiciales") !== -1) {
    window.__initLang = "es";
  } else if (ref.indexOf("paginainicialpt") !== -1) {
    window.__initLang = "pt";
  } else {
    var browserLang = (navigator.language || navigator.userLanguage || "pt").toLowerCase();
    window.__initLang = browserLang.startsWith("pt") ? "pt" : "es";
  }
})();
var lang = window.__initLang;

var view = "countries", activeCountry = null, activeEq = null;
function normaliseEq(raw) {
  var w = (raw||"").toLowerCase().trim().replace(/\s+/g," ");
  var n = w.normalize("NFD").replace(/[̀-ͯ]/g,"");
  return EQ_ALIASES[w] || EQ_ALIASES[n] || null;
}
function getSuppliers(country, eqKey) {
  return (SHEET_DATA[country]||[]).filter(function(r){ return normaliseEq(r["Equipamiento"]) === eqKey; });
}
function toggleLang() { lang = lang==="pt" ? "es" : "pt"; updateStatic(); render(); updateHeaderBack(); }
function updateStatic() {
  var t = T[lang];
  document.documentElement.lang = lang==="pt" ? "pt-BR" : "es-419";
  document.getElementById("logo-sub").textContent = t.logoSub;
  document.getElementById("lang-link").textContent = t.langLink;
  document.getElementById("hero-eyebrow").textContent = t.eyebrow;
  document.getElementById("hero-h1").innerHTML = t.h1a + " <span>" + t.h1b + "</span>";
  document.getElementById("hero-sub").textContent = t.sub;
  document.getElementById("hero-pills").innerHTML = t.pills.map(function(p){ return '<div class="pill">'+p+'</div>'; }).join("");
  document.getElementById("footer-note").textContent = t.footerNote;
  document.getElementById("back-home-label").textContent = t.backHome;
  document.getElementById("back-home-link").href = t.backHomeUrl;
}
var BACK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      c = COUNTRIES[i];

    }
    html += '</div>';

    c = null;

    if (cp) {
      html += '<div class="compras-card"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><div class="compras-card-info"><span class="compras-card-label">' + COMPRAS_LABEL[lang] + '</span><span class="compras-card-name">' + cp.name + '</span><span class="compras-card-email"><a href="mailto:' + cp.email + '">' + cp.email + '</a></span></div></div>';
    }
    html += '<div class="section-title">' + c.flag + ' ' + activeCountry + ' &middot; ' + t.chooseEq + '</div>';

    for (i = 0; i < EQS.length; i++) {
      eq = EQS[i];
      var n = getSuppliers(activeCountry, eq.key).length;

      var sp = lang === "pt" ? eq.specs_pt : eq.specs_es;
      html += '<div class="eq-card" onclick="selectEq(\'' + eq.key + '\')" style="animation-delay:' + (i*0.04) + 's">';

      html += '</div></div>';
    }

  } else {
    c = null;
    for (i = 0; i < COUNTRIES.length; i++) { if (COUNTRIES[i].key === activeCountry) c = COUNTRIES[i]; }
    eq = null;
    for (i = 0; i < EQS.length; i++) { if (EQS[i].key === activeEq) eq = EQS[i]; }
    var eqName = eq[lang] || eq.pt;
    var specs = lang === "pt" ? eq.specs_pt : eq.specs_es;
    var sups = getSuppliers(activeCountry, activeEq);
    html = '<button class="back-btn" onclick="goBack()">' + BACK_SVG + t.back + '</button>';
    html += '<div class="detail-hero">';
    html += '<div class="detail-icon-wrap">' + (ICONS[activeEq]||"") + '</div>';

    html += '<div class="detail-eq-specs">' + specs + '</div>';
    html += '<div class="detail-country-badge">' + c.flag + ' ' + activeCountry + '</div>';
    html += '</div></div>';
    html += '<div class="section-title">' + t.suppliers + '</div>';
    if (sups.length === 0) {
      html += '<div class="no-sup"><span class="no-sup-icon">&#128235;</span>';
      html += '<strong>' + t.noSup + '</strong><br>';
      html += '<span style="font-size:12px;color:var(--gray);margin-top:6px;display:block">' + t.noSupHint + '</span></div>';
    } else {
      html += '<div class="sup-grid">';
      for (i = 0; i < sups.length; i++) {
        var s = sups[i];
        var sname = s["Nombre del Proveedor"] || "&mdash;";
        var contact = s["Contacto"] || "";
        var email = s["Correo"] || "";
        var phone = s["Teléfono"] || "";
        var cap = s["Capacidad (unit/mes)"] || "";
        var status = s["Status de Homologación"] || "";
        var words = sname.split(" ").filter(Boolean);
        var initials = (words.length >= 2 ? words[0][0]+words[1][0] : (words[0] ? words[0][0] : "?")).toUpperCase();
        var sv = (s["Aprobado por SHE"]||"").toLowerCase().trim();
        var sheLbl, sheCls;
        if (["sim","si","sí","yes","s"].indexOf(sv) >= 0) { sheLbl = t.sheYes; sheCls = "she-ok"; }
        else if (["não","nao","no","n"].indexOf(sv) >= 0) { sheLbl = t.sheNo; sheCls = "she-no"; }
        else if (sv.indexOf("anal") >= 0) { sheLbl = t.sheAna; sheCls = "she-ana"; }
        else { sheLbl = t.sheNd; sheCls = "she-nd"; }
        html += '<div class="sup-card" style="animation-delay:' + (i*0.07) + 's">';
        html += '<div class="sup-card-top"><div class="sup-avatar">' + initials + '</div><div>';
        html += '<div class="sup-name">' + sname + '</div>';
        if (status) html += '<div class="sup-company">' + status + '</div>';
        html += '<div style="margin-top:8px"><span class="she-badge ' + sheCls + '"><span class="she-dot"></span>' + sheLbl + '</span></div>';
        html += '</div></div><div class="sup-card-body">';
        if (contact) html += '<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M2 12c0-2.761 2.239-5 5-5s5 2.239 5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span><strong>' + t.contactPerson + ':</strong> ' + contact + '</span></div>';
        if (email) html += '<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><rect x="1.5" y="3" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 5l5.5 3.5L12.5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><a href="mailto:' + email + '">' + email + '</a></div>';
        if (phone) html += '<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><path d="M4 2h2.5l1 3-1.5 1c.7 1.4 1.6 2.3 3 3l1-1.5 3 1V11c0 .6-.5 1-1.1.9C4.7 11.1 2 7.3 2 3.1 2 2.5 2.5 2 3 2H4z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>' + phone + '</span></div>';
        if (cap) html += '<div class="contact-row"><svg viewBox="0 0 14 14" fill="none"><rect x="1.5" y="5" width="11" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 5V3.5a2.5 2.5 0 015 0V5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span>' + cap + ' un/mês</span></div>';
        html += '</div></div>';
      }
      html += '</div>';
    }
  }
  app.innerHTML = html;
}
function updateHeaderBack() {
  var btn = document.getElementById("header-back-btn");
  if (view === "countries") { btn.style.display = "none"; }
  else { btn.style.display = "inline-flex"; document.getElementById("header-back-label").textContent = T[lang].back; }
}
function selectCountry(k) { activeCountry=k; view="equipments"; render(); updateHeaderBack(); window.scrollTo({top:0,behavior:"smooth"}); }
function selectEq(k) { activeEq=k; view="detail"; render(); updateHeaderBack(); window.scrollTo({top:0,behavior:"smooth"}); }
function goBack() {
  if (view==="detail") { view="equipments"; activeEq=null; }
  else { view="countries"; activeCountry=null; }
  render(); updateHeaderBack(); window.scrollTo({top:0,behavior:"smooth"});
}
function goHome() { view="countries"; activeCountry=null; activeEq=null; render(); updateHeaderBack(); window.scrollTo({top:0,behavior:"smooth"}); }

fetchData();
setInterval(fetchData, REFRESH_MS);
